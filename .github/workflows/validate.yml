name: Validate
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true    
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
      - run: tofu fmt -check -recursive
      - name: Validate all roots without Azure access
        shell: bash
        run: |
          set -euo pipefail
          for root in environments/bootstrap environments/github-identity customers/summit-property-management/lab; do
            tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$root" validate
          done


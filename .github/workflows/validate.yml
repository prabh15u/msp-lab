name: Validate
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true    
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.6
      - run: tofu fmt -check -recursive
      - name: Validate all roots without Azure access
        shell: bash
        run: |
          set -euo pipefail
          for root in environments/bootstrap environments/github-identity customers/summit-property-management/lab; do
            tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$root" validate
          done


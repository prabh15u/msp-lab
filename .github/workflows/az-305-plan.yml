name: AZ-305 Terraform Test

on:
  push:
    branches:
      - az-305-test
    paths:
      - "environments/az305/**"

  pull_request:
    paths:
      - "environments/az305/**"

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: az-305-lab
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: environments/az305
    env:
      TF_VAR_admin_username: ${{ secrets.TF_VAR_ADMIN_USERNAME }}
      TF_VAR_admin_public_key: ${{ secrets.TF_VAR_ADMIN_PUBLIC_KEY }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID }}
      STATE_STORAGE_ACCOUNT: ${{ vars.STATE_STORAGE_ACCOUNT }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - run: terraform fmt -check

      - run: terraform validate

      - run: terraform plan -input=false
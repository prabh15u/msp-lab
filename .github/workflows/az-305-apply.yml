name: AZ-305 OpenTofu Apply

on:
  workflow_dispatch:

jobs:
  tofu:
    runs-on: ubuntu-latest
    environment: azure-oidc
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: environments/az-305
    env:
      TF_VAR_admin_username: ${{ vars.TF_VAR_ADMIN_USERNAME }}
      TF_VAR_admin_public_key: ${{ vars.TF_VAR_ADMIN_PUBLIC_KEY }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID }}
      STATE_STORAGE_ACCOUNT: ${{ vars.STATE_STORAGE_ACCOUNT }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: az-305-test

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: OpenTofu Init
        run: |
          tofu init -reconfigure \
            -backend-config="resource_group_name=${{ vars.STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=az-305" \
            -backend-config="key=az305/terraform.tfstate"

      - run: tofu fmt -check

      - run: tofu validate

      - run: tofu apply -auto-approve -input=false
